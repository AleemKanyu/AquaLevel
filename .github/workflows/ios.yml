name: iOS CI & Unsigned IPA Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Add iOS Platform & Sync Capacitor
        run: |
          npx cap add ios || true
          npm run sync
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install || pod install --repo-update || true
            cd ../..
          fi

      - name: Build Xcode Archive (Ad-Hoc Unsigned)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          xcodebuild archive \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package & Ad-Hoc Sign IPA for Sideloadly / AltStore
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/App.xcarchive -name "*.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: App bundle not found in archive!"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/

          # Apply ad-hoc signature so iOS sideloading tools (Sideloadly, AltStore, etc.) can verify and re-sign
          codesign --force --deep --sign - build/Payload/*.app

          cd build
          zip -r AquaLevel-unsigned.ipa Payload
          ls -lh AquaLevel-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaLevel-unsigned-ipa
          path: build/AquaLevel-unsigned.ipa
          if-no-files-found: error
